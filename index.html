<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Eliščin cukrářský trenažér</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: aplikace – boční menu na počítači, spodní lišta na mobilu; obsah v jednom sloupci max ~760px */
:root{
  --bg:#f8f6f7; --surface:#ffffff; --surface2:#f2edf0; --line:#e6dde2;
  --fg:#29222a; --muted:#6d6169;
  --accent:#a8325e; --accent-hover:#8f2850; --accent-soft:#f7e4ec; --on-accent:#ffffff;
  --good:#2c7a55; --good-soft:#e0f1e8; --bad:#b93a2e; --bad-soft:#fbe7e4; --warn:#94620f; --warn-soft:#f9eed6;
  --shadow:0 1px 2px rgba(60,30,45,.06),0 2px 8px rgba(60,30,45,.05);
  --font:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#18141a; --surface:#221c24; --surface2:#2b242e; --line:#3a313d;
  --fg:#f1ebf0; --muted:#b4a8b1;
  --accent:#ee86ad; --accent-hover:#f5a2c1; --accent-soft:#3d2531; --on-accent:#2a1520;
  --good:#6fcf9c; --good-soft:#1e3328; --bad:#f08a7e; --bad-soft:#3b2220; --warn:#e9b85c; --warn-soft:#382d18;
  --shadow:none; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#18141a; --surface:#221c24; --surface2:#2b242e; --line:#3a313d;
  --fg:#f1ebf0; --muted:#b4a8b1;
  --accent:#ee86ad; --accent-hover:#f5a2c1; --accent-soft:#3d2531; --on-accent:#2a1520;
  --good:#6fcf9c; --good-soft:#1e3328; --bad:#f08a7e; --bad-soft:#3b2220; --warn:#e9b85c; --warn-soft:#382d18;
  --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{line-height:1.2;text-wrap:balance;margin:0}
h1{font-size:1.65rem;font-weight:800;letter-spacing:-.01em}
h2{font-size:1.2rem;font-weight:700}
h3{font-size:1.02rem;font-weight:700}
p{margin:0}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* shell */
.shell{display:flex;min-height:100%}
.side{display:none}
.main{flex:1;min-width:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 110px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
.bottom a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:10px;text-decoration:none;color:var(--muted);font-size:.72rem;font-weight:600}
.bottom a svg{width:22px;height:22px}
.bottom a.on{color:var(--accent);background:var(--accent-soft)}
@media (min-width:900px){
  .bottom{display:none}
  .side{display:flex;flex-direction:column;gap:4px;width:240px;flex:none;position:sticky;top:0;height:100vh;overflow:auto;
    background:var(--surface);border-right:1px solid var(--line);padding:20px 14px}
  .side .brand{padding:4px 10px 16px;font-weight:800;font-size:1.05rem;line-height:1.25}
  .side .brand small{display:block;font-weight:500;color:var(--muted);font-size:.8rem}
  .side a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;text-decoration:none;color:var(--fg);font-weight:600;font-size:.95rem}
  .side a svg{width:20px;height:20px;color:var(--muted)}
  .side a:hover{background:var(--surface2)}
  .side a.on{background:var(--accent-soft);color:var(--accent)}
  .side a.on svg{color:var(--accent)}
  .side .sep{height:1px;background:var(--line);margin:8px 6px}
  .main{padding-block:32px 48px}
}

/* generic */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.eyebrow{font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 16px;border-radius:10px;border:1px solid var(--line);
  background:var(--surface);font-weight:700;cursor:pointer;text-decoration:none;color:var(--fg);font-size:.95rem;text-align:center}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-hover)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:default}
.back{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-weight:600;color:var(--muted);font-size:.92rem}
.back:hover{color:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:999px;font-size:.78rem;font-weight:700;background:var(--surface2);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
.added{display:inline-block;margin-left:6px;padding:0 7px;border-radius:6px;font-size:.72rem;font-weight:700;background:var(--warn-soft);color:var(--warn);vertical-align:1px;white-space:nowrap}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.good>i{background:var(--good)}
input[type=text],input[type=search],input[type=date],select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{min-height:140px;resize:vertical;line-height:1.5}
label.lbl{font-weight:700;font-size:.9rem;display:block;margin-bottom:6px}
.seg{display:inline-flex;background:var(--surface2);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:8px;font-weight:700;font-size:.88rem;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.seg button.on.g{color:var(--good)}
.seg button.on.w{color:var(--warn)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:.92rem;z-index:50}
@media (min-width:900px){.toast{bottom:24px}}

/* home */
.hello h1{font-size:1.9rem}
.count{display:flex;align-items:baseline;gap:8px}
.count b{font-size:2.4rem;font-weight:800;color:var(--accent);line-height:1}
.qa{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:600px){.qa{grid-template-columns:repeat(4,1fr)}}
.qa a{display:flex;flex-direction:column;gap:4px;padding:14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--fg);box-shadow:var(--shadow)}
.qa a:hover{border-color:var(--accent)}
.qa a b{font-size:.98rem}
.qa a span{font-size:.82rem;color:var(--muted)}
.grp{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.grp .bar{grid-column:1/-1}

/* topic list */
.tlist{display:flex;flex-direction:column;gap:8px}
.titem{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);text-decoration:none;color:var(--fg)}
.titem:hover{border-color:var(--accent)}
.tnum{width:48px;height:48px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:800;font-size:1.15rem}
.titem .tt{font-weight:700;line-height:1.3}
.titem .ts{font-size:.82rem;color:var(--muted)}
.titem .bar{margin-top:6px;max-width:220px}
.ghead{display:flex;justify-content:space-between;align-items:baseline;margin:6px 2px 0}

/* topic detail */
.zad{background:var(--accent-soft);border-radius:var(--r);padding:16px 18px}
.zad ul{margin:8px 0 0;padding-left:20px}
.zad li{margin:3px 0}
.osnova{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.osnova li{display:grid;grid-template-columns:26px 1fr;gap:8px}
.osnova li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);margin:8px 0 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:.88rem;font-variant-numeric:tabular-nums}
details.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
details.sec+details.sec{margin-top:-4px}
details.sec>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:700}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin-right:4px;flex:none;transition:transform .15s}
details.sec[open]>summary::after{transform:rotate(-135deg)}
details.sec>.body{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
.body ul,.body ol{margin:0;padding-left:22px}
.body li{margin:4px 0}
.body ol.steps{list-style:none;padding:0;counter-reset:s;display:flex;flex-direction:column;gap:8px}
.body ol.steps li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:10px;margin:0}
.body ol.steps li::before{content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-weight:800;font-size:.82rem;color:var(--accent)}
dl.pairs{margin:0;display:grid;grid-template-columns:minmax(110px,auto) 1fr;gap:8px 16px}
dl.pairs dt{font-weight:700}
dl.pairs dd{margin:0}
@media (max-width:520px){dl.pairs{grid-template-columns:1fr;gap:2px}dl.pairs dd{margin-bottom:8px}}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:.93rem}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--surface2);font-size:.8rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
tr:last-child td{border-bottom:0}
td.t{white-space:nowrap;font-weight:700;font-variant-numeric:tabular-nums}
.fault td:first-child{font-weight:600;width:45%}
.flow{display:flex;flex-direction:column;gap:8px}
.flow .br{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.flow .bx{padding:5px 10px;border-radius:8px;background:var(--surface2);border:1px solid var(--line);font-size:.88rem;font-weight:600}
.flow .br .bx:first-child{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.flow .ar{color:var(--muted);font-weight:700}
.flow .join{display:flex;flex-direction:column;align-items:flex-start;gap:4px;margin-top:4px;padding-left:12px;border-left:3px solid var(--accent)}
.prod{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.prod h3{font-size:.98rem}
.note{background:var(--surface2);border-radius:10px;padding:10px 12px;font-size:.92rem}

/* quiz */
.qcard{display:flex;flex-direction:column;gap:16px}
.qtop{display:flex;justify-content:space-between;align-items:center;gap:10px}
.qq{font-size:1.2rem;font-weight:700;line-height:1.35}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:flex-start;gap:12px;text-align:left;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;line-height:1.4}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .k{flex:none;width:26px;height:26px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-size:.8rem;font-weight:800;color:var(--muted)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.ok .k{background:var(--good);color:var(--surface)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opt.no .k{background:var(--bad);color:var(--surface)}
.opt[disabled]{cursor:default}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.fb{border-radius:10px;padding:12px 14px;font-weight:600}
.fb.ok{background:var(--good-soft);color:var(--good)}
.fb.no{background:var(--bad-soft);color:var(--bad)}
.fb span{display:block;font-weight:500;color:var(--fg);margin-top:4px}
.match{display:flex;flex-direction:column;gap:10px}
.match .m{display:flex;flex-direction:column;gap:4px}
.match .m b{font-size:.95rem}
.match select.ok{border-color:var(--good);background:var(--good-soft)}
.match select.no{border-color:var(--bad);background:var(--bad-soft)}
.match .fix{font-size:.85rem;color:var(--good);font-weight:600}
.big{font-size:3rem;font-weight:800;line-height:1;color:var(--accent)}
.res li{margin:8px 0}

/* flashcards */
.flash{perspective:1200px;cursor:pointer;min-height:260px;display:grid}
.flash .in{position:relative;display:grid;transition:transform .45s;transform-style:preserve-3d}
.flash.flip .in{transform:rotateY(180deg)}
.flash .face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:16px;
  padding:28px 22px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:12px;box-shadow:var(--shadow);min-height:260px}
.flash .face.back{transform:rotateY(180deg);background:var(--accent-soft);border-color:transparent}
.flash .face .t{font-size:1.25rem;font-weight:700;line-height:1.35}
.flash .face.back .t{font-size:1.08rem;font-weight:600}
.flash .hint{font-size:.82rem;color:var(--muted)}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rate .btn.r1{border-color:var(--bad);color:var(--bad)}
.rate .btn.r2{border-color:var(--warn);color:var(--warn)}
.rate .btn.r3{border-color:var(--good);color:var(--good)}
@media (prefers-reduced-motion:reduce){.flash .in{transition:none}}

/* scope picker */
.scopes{display:flex;flex-direction:column;gap:8px}
.scope{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer;text-align:left;width:100%}
.scope:hover{border-color:var(--accent)}
.scope.on{border-color:var(--accent);background:var(--accent-soft)}
.scope b{display:block}
.scope span{font-size:.84rem;color:var(--muted)}

/* exam */
.timer{font-size:2.6rem;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.check{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--surface)}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--good);flex:none}
.check.on{background:var(--good-soft);border-color:transparent}

/* misc */
.vocab td:first-child{width:50%}
.search-hit mark{background:var(--warn-soft);color:var(--fg);border-radius:3px;padding:0 2px}
.more{display:flex;flex-direction:column;gap:8px}
.more a{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);text-decoration:none;color:var(--fg);font-weight:700}
.more a span{font-weight:500;color:var(--muted);font-size:.86rem;display:block}
hr{border:0;border-top:1px solid var(--line);margin:0}
</style>

<div class="shell">
  <nav class="side" id="side" aria-label="Menu"></nav>
  <main class="main"><div class="wrap" id="view"></div></main>
</div>
<nav class="bottom" id="bottom" aria-label="Menu"></nav>
<script>
/* ===== OBSAH TRENAŽÉRU =====
   Každá otázka (topic) má:
   id, num, group, title, zadani[], osnova[], key[], sections[], quiz[], cards[]
   Položka seznamu může být text, nebo {t:"...", add:1} = doplněno (není ve školních podkladech).
   Sekce: h (nadpis), add (celá doplněná), text, pairs, list, steps (+order:1 = kvíz na pořadí),
          flow {branches:[[...]], join:[...]}, temps [[co, teplota, čas]], faults [[vada, příčina]],
          products [{n, d, list, steps}]
   Kvíz: ["mc", otázka, správně, [špatně...], vysvětlení?] | ["tf", tvrzení, true/false, vysvětlení?]
*/

const GROUPS = [
  { id: "sleh", name: "Šlehané hmoty", short: "Šlehané" },
  { id: "tren", name: "Třené hmoty", short: "Třené" },
  { id: "testa", name: "Tuková a perníková těsta", short: "Těsta" },
  { id: "jadr", name: "Jádrové hmoty", short: "Jádrové" }
];

const ZZK = "Část mléka dáme s cukrem vařit. Do zbytku mléka rozmícháme krémový prášek a žloutky, směs vlijeme do vařícího mléka a za stálého míchání vaříme, až škrob zmazovatí. Hotový ZŽK nalijeme na plech a necháme vystydnout.";

const TOPICS = [
/* ---------------------------------------------------------------- 1 */
{
  id: "1", num: 1, group: "sleh",
  title: "Šlehané hmoty s rychlošlehacím přípravkem",
  zadani: [
    "Charakterizujte hmoty s RŠ přípravkem, vyjmenujte výhody a nevýhody použití RŠ přípravku",
    "Popište postup výroby hmoty",
    "Uveďte výrobky z hmot s RŠ přípravkem"
  ],
  osnova: [
    "Rychlošlehací (RŠ) pasta je emulgační látka – s vejci vytváří objemné, pevné a stálé pěny",
    "Všechny suroviny se šlehají najednou (kromě tuku), jen 3–5 minut místo 30",
    "Výhody: rychlost, hygiena, stabilní hmota (vydrží až 2 hodiny), vláčnější a déle čerstvé korpusy",
    "Nevýhody: hmota je řidší (nejde stříkat), pečení trvá o něco déle, korpusy mají menší objem",
    "Pasta obsahuje cukr a glukózový sirup, emulgátory, modifikované škroby a konzervanty",
    "Výrobky: všechno kromě buflerů a cukrářských piškotů"
  ],
  key: ["šlehání 3–5 min (místo 30 min)", "hmota vydrží 2 hodiny", "tuk až na konec"],
  sections: [
    { h: "Charakteristika", list: [
      "Do šlehané hmoty se přidává RYCHLOŠLEHACÍ PASTA",
      "RŠ pasta je emulgační látka, která má s vejci a ostatními surovinami vysoké šlehací schopnosti",
      "Vytváří objemné, pevné a stálé pěny",
      "Díky ní se může změnit technologie šlehaných i třených hmot"
    ]},
    { h: "Co pasta obsahuje", pairs: [
      ["Cukr a glukózový sirup", "lepší šlehatelnost, jemná sladkost"],
      ["Emulgátory", "umožňují napěnění a stabilizaci"],
      ["Modifikované škroby", "vážou vodu a zpevňují strukturu"],
      ["Konzervační látky", "korpus tolik neplesniví"]
    ]},
    { h: "Výhody", list: [
      "Všechny suroviny se šlehají najednou, kromě tuku",
      "Odpadá nahřívání hmoty při šlehání",

  const faults = topicFaults(t);
  faults.forEach((f, k) => {
    let pool = uniq(faults.filter(x => x[1] !== f[1]).map(x => x[1]));
    if (pool.length < 3) pool = uniq(pool.concat(shuffle(ALL_CAUSES.filter(c => c !== f[1]))));
    out.push({ id: t.id + "-f" + k, topic: t.id, type: "mc", q: "Jaká je příčina vady: „" + f[0] + "“?", correct: f[1], wrongPool: pool });
  });
  if (faults.length >= 4) out.push({ id: t.id + "-m", topic: t.id, type: "match", q: "Přiřaď ke každé vadě její příčinu", faults });
  t.sections.forEach((s, k) => {

/* ===== KVÍZY – VÝBĚR ===== */
let PK = { scope: "all", n: 10 };
function scopeButtons(kind) {

  const unit = n => kind === "q" ? n + " " + plural(n, "otázka", "otázky", "otázek") : n + " " + plural(n, "kartička", "kartičky", "kartiček");
  const items = [["all", "Celá látka", "všechny otázky dohromady"]]
    .concat(GROUPS.map(g => ["g:" + g.id, g.name, "otázky " + ORDERED.filter(t => t.group === g.id).map(t => t.num).join(", ")]))
    .concat([["en", "Angličtina", "slovíčka k popisu výrobku"], ["pojmy", "Zkratky a pojmy", "ZŽK, CKP, inverze…"]]);
  if (kind === "q") items.push(["chyby", "Moje chyby", "otázky, které se nepovedly"]);
  const isTopic = PK.scope.startsWith("t:");
  return `<div class="scopes">${items.map(i => `<button class="scope ${PK.scope === i[0] ? "on" : ""}" data-act="scope" data-s="${i[0]}"><span><b>${esc(i[1])}</b><span>${esc(i[2])}</span></span><span class="pill num">${unit(count(i[0]))}</span></button>`).join("")}</div>
    <div><label class="lbl" for="tsel">Nebo jen jedna otázka</label>
    <select id="tsel"><option value="">— vyber otázku —</option>${ORDERED.map(t => `<option value="t:${t.id}" ${PK.scope === "t:" + t.id ? "selected" : ""}>${t.num}. ${esc(t.title)}</option>`).join("")}</select></div>
    ${isTopic ? `<p class="small"><span class="pill accent">Vybráno</span> ${esc(scopeName(PK.scope))}</p>` : ""}`;
}
function vQuizPick() {

/* ===== KVÍZ – HRA ===== */
let QZ = null;
function prep(q) {
  const p = Object.assign({}, q);
  if (q.type === "mc") {
    const wrong = q.wrong ? q.wrong : shuffle(uniq(q.wrongPool).filter(x => x !== q.correct)).slice(0, 3);
    p.opts = shuffle([q.correct].concat(wrong));
  } else if (q.type === "tf") {
    p.opts = ["Pravda", "Nepravda"]; p.correct = q.v ? "Pravda" : "Nepravda";
  } else if (q.type === "match") {
    p.pairs = shuffle(q.faults).slice(0, 4); p.choices = shuffle(p.pairs.map(x => x[1]));
  } else if (q.type === "order") {
    let s = shuffle(q.items); if (s.join("|") === q.items.join("|")) s = s.slice(1).concat(s[0]);
    p.shuf = s; p.picked = [];
  }
  return p;
}
function startQuiz(scope, n, list) {
  let pool = list || scopeQ(scope);
  if (!pool.length) { toast("Tady zatím nejsou žádné otázky."); return; }
  pool = shuffle(pool);
  if (n) pool = pool.slice(0, n);
  QZ = { scope, title: scopeName(scope), list: pool.map(prep), i: 0, score: 0, done: false, wrong: [] };
  go("kviz-hra");
}
function vQuizPlay() {
  if (!QZ) { go("kvizy"); return; }
  if (QZ.i >= QZ.list.length) return quizResult();
  const q = QZ.list[QZ.i], n = QZ.list.length, t = q.topic && T(q.topic);
  QZ.done = false;
  let body = "";
  if (q.type === "mc" || q.type === "tf") {
    body = `<div class="opts">${q.opts.map((o, i) => `<button class="opt" data-act="ans" data-i="${i}"><span class="k">${q.type === "tf" ? (i ? "N" : "P") : "ABCD"[i]}</span><span>${esc(o)}</span></button>`).join("")}</div>`;
  } else if (q.type === "match") {
    body = `<div class="match">${q.pairs.map((p, i) => `<div class="m"><b>${esc(p[0])}</b><select id="m${i}" aria-label="Příčina"><option value="">— vyber příčinu —</option>${q.choices.map(c => `<option>${esc(c)}</option>`).join("")}</select><span class="fix" id="mf${i}" hidden></span></div>`).join("")}</div>
      <button class="btn primary" data-act="checkmatch">Zkontrolovat</button>`;
  } else if (q.type === "order") {
    body = `<p class="small muted">Klepej na kroky v pořadí, jak jdou po sobě.</p><div id="ord"></div>`;
  }
  view(`
    <div class="qtop"><a class="back" href="#kvizy">← Ukončit</a><span class="pill num">${QZ.i + 1} / ${n}</span></div>
    <div class="bar"><i style="width:${QZ.i / n * 100}%"></i></div>
    <div class="card qcard">
      <div class="row"><span class="pill accent">${t ? "Otázka " + t.num : esc(QZ.title)}</span>${q.type === "tf" ? '<span class="pill">Pravda, nebo ne?</span>' : ""}</div>
      <p class="qq">${esc(q.q)}</p>
      ${body}
      <div id="fb"></div>
    </div>
    <button id="next" class="btn primary block" data-act="next" hidden>${QZ.i + 1 < n ? "Další otázka" : "Zobrazit výsledek"}</button>
  `);
  if (q.type === "order") renderOrder();
}
function renderOrder() {
  const q = QZ.list[QZ.i];
  const left = q.shuf.filter(x => !q.picked.includes(x));
  $("#ord").innerHTML = `
    ${q.picked.length ? `<ol class="steps body" style="padding:0;margin-bottom:12px">${q.picked.map(x => `<li><span>${esc(x)}</span></li>`).join("")}</ol>` : ""}
    <div class="opts">${left.map(x => `<button class="opt" data-act="ord" data-v="${esc(x)}"><span class="k">+</span><span>${esc(x)}</span></button>`).join("")}</div>
    ${q.picked.length && !QZ.done ? `<button class="btn ghost" data-act="ordreset" style="margin-top:8px">Začít znovu</button>` : ""}`;
}
function record(ok) {
  const q = QZ.list[QZ.i];
  QZ.done = true;
  if (ok) { QZ.score++; S.qok[q.id] = 1; delete S.mistakes[q.id]; }
  else { delete S.qok[q.id]; S.mistakes[q.id] = (S.mistakes[q.id] || 0) + 1; QZ.wrong.push(q); }
  save();
  $("#next").hidden = false;
}
function feedback(ok, extra) {
  const q = QZ.list[QZ.i];
  const why = q.why ? esc(q.why) : "";
  $("#fb").innerHTML = `<div class="fb ${ok ? "ok" : "no"}">${ok ? "Správně!" : "Tohle nevyšlo."}${extra || why ? `<span>${extra || ""}${extra && why ? " " : ""}${why}</span>` : ""}</div>`;
}
function quizResult() {
  const n = QZ.list.length, sc = QZ.score, pct = Math.round(sc / n * 100);
  if (!QZ.saved) {
    QZ.saved = true;
    S.best[QZ.scope] = Math.max(S.best[QZ.scope] || 0, pct);
    S.history.push({ d: Date.now(), s: QZ.title, sc, n, k: "quiz" });
    S.history = S.history.slice(-40); save();
  }
  const msg = pct >= 90 ? "Výborně, tohle umíš!" : pct >= 70 ? "Dobrá práce, ještě kousek." : pct >= 50 ? "Půlka je tam. Projdi si chyby." : "Nevadí – mrkni do látky a zkus to znovu.";
  view(`
    <a class="back" href="#kvizy">← Kvízy</a>
    <section class="card stack" style="align-items:flex-start">
      <p class="eyebrow">${esc(QZ.title)}</p>
      <span class="big num">${pct} %</span>
      <p><b>${sc} z ${n}</b> správně. ${msg}</p>
    </section>
    ${QZ.wrong.length ? `<section class="stack"><h2>Co se nepovedlo</h2><div class="card"><ul class="res" style="margin:0;padding-left:20px">${QZ.wrong.map(q => `<li><b>${esc(q.q)}</b><br><span class="small" style="color:var(--good)">${esc(correctText(q))}</span></li>`).join("")}</ul></div></section>` : ""}
    <div class="grid2">
      ${QZ.wrong.length ? `<button class="btn primary" data-act="retry">Zopakovat chybné (${QZ.wrong.length})</button>` : ""}
      <button class="btn" data-act="again">Nový kvíz ze stejné látky</button>
      <a class="btn" href="#kvizy">Zpět na výběr</a>
    </div>
  `);
}
function correctText(q) {
  if (q.type === "mc") return "Správně: " + q.correct;
  if (q.type === "tf") return "Správně: " + (q.v ? "pravda" : "nepravda") + (q.why ? " – " + q.why : "");
  if (q.type === "match") return q.pairs.map(p => p[0] + " → " + p[1]).join(" · ");
  if (q.type === "order") return q.items.map((x, i) => (i + 1) + ". " + x).join("  ");
  return "";
}

        </tbody></table></div></div></details>
      <details class="sec"><summary><span>Čísla a poměry</span></summary><div class="body"><dl class="pairs">${NUMBERS.map(n => `<dt>${esc(n[0])}</dt><dd>${esc(n[1])}</dd>`).join("")}</dl></div></details>
      <details class="sec"><summary><span>Zkratky a pojmy</span></summary><div class="body"><dl class="pairs">${GLOSSARY.map(n => `<dt>${esc(n[0])}</dt><dd>${esc(n[1])}</dd>`).join("")}</dl></div></details>
      <details class="sec"><summary><span>Krémy a polevy, které se opakují</span></summary><div class="body"><dl class="pairs">${RECIPES.map(n => `<dt>${esc(n[0])}</dt><dd>${esc(n[1])}</dd>`).join("")}</dl></div></details>
      <details class="sec"><summary><span>Šlehání × tření</span></summary><div class="body"><dl class="pairs">
        <dt>Šlehání</dt><dd>tekuté suroviny (vejce, bílky) – vytváříme pěnu</dd>
        <dt>Tření</dt><dd>tužší suroviny (tuk s cukrem, žloutky)</dd>
        <dt>Cukr do šlehaných hmot</dt><dd>krupice – krystal se špatně rozpouští, moučka moc rychle</dd>
        <dt>Mouka</dt><dd>vždy prosejeme – provzdušnění a odstranění nečistot</dd>
      </dl></div></details>
    </div>
  `);
}

/* ===== POZNÁMKY ===== */
function vNotes() {
  const withNotes = ORDERED.filter(t => (S.notes[t.id] || "").trim());
  view(`
    <header class="stack" style="gap:6px"><h1>Poznámky</h1><p class="muted">Tvůj blok. Píšeš a ukládá se to samo.</p></header>
    <section class="card stack"><h2>Obecné poznámky</h2>
      <textarea id="note-g" style="min-height:220px" placeholder="Termíny, co říkala učitelka, co si chci zopakovat…">${esc(S.general)}</textarea></section>
    <section class="stack"><h2>Poznámky u otázek</h2>
      ${withNotes.length ? withNotes.map(t => `<a class="card stack" href="#otazka-${t.id}" style="text-decoration:none;color:inherit;gap:4px"><span class="eyebrow">Otázka ${t.num}</span><b>${esc(t.title)}</b><span class="small muted" style="white-space:pre-line">${esc(S.notes[t.id].slice(0, 220))}${S.notes[t.id].length > 220 ? "…" : ""}</span></a>`).join("") : `<p class="muted small">Zatím žádné. Poznámku k otázce napíšeš dole na stránce každé otázky.</p>`}
    </section>
  `);
}

/* ===== NASTAVENÍ ===== */
let RESET_ARM = false;
function vSettings() {
  RESET_ARM = false;
  view(`
    <header class="stack" style="gap:6px"><h1>Nastavení a záloha</h1></header>
    <section class="card stack"><h2>Datum zkoušek</h2>
      <input type="date" id="exam" value="${esc(S.exam)}"><p class="small muted">Až budeš znát přesné datum, změň ho tady.</p></section>
    <section class="card stack"><h2>Záloha</h2>
      <p class="small">Pokrok a poznámky se ukládají jen v tomhle prohlížeči. Na mobilu a na počítači jsou zvlášť. Zálohou je přeneseš: zkopíruj ji na jednom zařízení, pošli si ji (třeba zprávou) a vlož ji na druhém.</p>
      <button class="btn" data-act="backup">Zkopírovat zálohu</button>
      <textarea id="bk" placeholder="Sem vlož zkopírovanou zálohu…" style="min-height:90px"></textarea>
      <button class="btn" data-act="restore">Obnovit ze zálohy</button>
    </section>
    <section class="card stack"><h2>Začít znovu</h2>
      <p class="small muted">Smaže pokrok v kartičkách, kvízech a výsledky. Poznámky zůstanou.</p>
      <button class="btn" data-act="reset" id="resetb">Smazat pokrok</button></section>
  `);
}
function vMore() {
  view(`
    <header class="stack" style="gap:6px"><h1>Více</h1></header>
    <div class="more">
      <a href="#naostro"><span>Zkouška naostro<span>vylosuj si otázku a odpověz nahlas</span></span>→</a>
      <a href="#anglictina"><span>Angličtina<span>slovíčka a popis výrobku</span></span>→</a>
      <a href="#tahaky"><span>Taháky<span>teploty, poměry, zkratky, krémy</span></span>→</a>
      <a href="#poznamky"><span>Poznámky<span>tvůj blok</span></span>→</a>
      <a href="#nastaveni"><span>Nastavení a záloha<span>datum zkoušek, přenos mezi zařízeními</span></span>→</a>

/* ===== AKCE ===== */
const ACT = {
  quick() { startQuiz("all", 10); },
  cardsall() { startCards("all", true); },
  mistakes() { if (!Object.keys(S.mistakes).length) { toast("Zatím nemáš žádné chyby."); return; } startQuiz("chyby", 0); },
  status(b) { const t = S.last; S.status[t] = +b.dataset.v; save(); $$(".seg button[data-act=status]").forEach(x => x.classList.toggle("on", x === b)); },
  expand(b) { const all = $$("details.sec"); const open = !all.every(d => d.open); all.forEach(d => d.open = open); b.textContent = open ? "Sbalit vše" : "Rozbalit vše"; },
  tquiz(b) { PK.scope = "t:" + b.dataset.t; startQuiz(PK.scope, 0); },
  tcards(b) { PK.scope = "t:" + b.dataset.t; startCards(PK.scope, false); },
  texam(b) { EX = { t: b.dataset.t, phase: "answer", sec: 0, checked: {} }; go("naostro"); },
  scope(b) { PK.scope = b.dataset.s; route(); },
  qn(b) { PK.n = +b.dataset.n; $$("[data-act=qn]").forEach(x => x.classList.toggle("on", x === b)); },
  startquiz() { startQuiz(PK.scope, PK.n); },
  ans(b) {
    if (QZ.done) return;
    const q = QZ.list[QZ.i], i = +b.dataset.i, ok = q.opts[i] === q.correct;
    $$(".opt").forEach((x, k) => { x.disabled = true; if (q.opts[k] === q.correct) x.classList.add("ok"); });
    if (!ok) b.classList.add("no");
    feedback(ok, ok ? "" : "Správně je: " + esc(q.correct) + ".");
    record(ok);
  },
  checkmatch() {
    if (QZ.done) return;
    const q = QZ.list[QZ.i];
    const vals = q.pairs.map((p, i) => $("#m" + i).value);
    if (vals.some(v => !v)) { toast("Vyber příčinu u všech vad."); return; }
    let ok = true;
    q.pairs.forEach((p, i) => {
      const s = $("#m" + i), good = vals[i] === p[1]; s.disabled = true; s.classList.add(good ? "ok" : "no");
      if (!good) { ok = false; const f = $("#mf" + i); f.hidden = false; f.textContent = "Správně: " + p[1]; }
    });
    $("[data-act=checkmatch]").hidden = true;
    feedback(ok);
    record(ok);
  },
  ord(b) {
    if (QZ.done) return;
    const q = QZ.list[QZ.i]; q.picked.push(b.dataset.v);
    if (q.picked.length === q.items.length) {
      const ok = q.picked.join("|") === q.items.join("|");
      QZ.done = true; renderOrder();
      feedback(ok, ok ? "" : "Správné pořadí: " + q.items.map((x, i) => (i + 1) + ". " + esc(x)).join(" · "));
      QZ.done = false; record(ok);
    } else renderOrder();
  },
  ordreset() { const q = QZ.list[QZ.i]; q.picked = []; renderOrder(); },
  next() { QZ.i++; route(); },
  retry() { const w = QZ.wrong; QZ.saved = false; startQuiz("retry", 0, w); },
  again() { startQuiz(QZ.scope === "retry" ? "all" : QZ.scope, QZ.scope === "chyby" ? 0 : (PK.n || 0)); },
  startcards() { startCards(PK.scope, CPK.only); },
  flip() { CS.flip = !CS.flip; $(".flash").classList.toggle("flip", CS.flip); $("#rate").hidden = !CS.flip; $("#rateh").hidden = CS.flip; },
  rate(b) { const v = +b.dataset.v, c = CS.list[CS.i]; S.cards[c.id] = v; CS.r[v - 1]++; save(); CS.i++; CS.flip = false; route(); },
  cardsagain() { startCards(CS.scope, true); },
  draw() { const t = ORDERED[Math.random() * ORDERED.length | 0]; EX = { t: t.id, phase: "answer", sec: 0, checked: {} }; route(); },
  exreset() { stopTimer(); EX = null; route(); },
  tgo(b) {
    if (TIMER) { stopTimer(); b.textContent = "Pokračovat"; return; }
    TIMER = setInterval(() => { EX.sec++; const el = $("#timer"); if (el) el.textContent = fmtT(EX.sec); }, 1000);
    b.textContent = "Pauza";
  },
  tzero() { stopTimer(); EX.sec = 0; route(); },
  excheck() { stopTimer(); EX.phase = "check"; route(); },
  exsave() {
    const t = T(EX.t), n = t.osnova.length, sc = Object.values(EX.checked).filter(Boolean).length, pct = Math.round(sc / n * 100);
    S.oral[t.id] = pct; S.history.push({ d: Date.now(), s: "Otázka " + t.num, sc, n, k: "oral" }); S.history = S.history.slice(-40); save();
    toast("Uloženo: " + sc + " z " + n + " bodů");
    EX = null; route();
  },
  entab(b) { ENTAB = b.dataset.v; route(); },
  enquiz() { startQuiz("en", 10); },
  encards() { startCards("en", true); },
  gquiz() { startQuiz("pojmy", 10); },
  gcards() { startCards("pojmy", true); },
  backup() {
    const data = JSON.stringify(S);
    const fallback = () => { const t = $("#bk"); t.value = data; t.focus(); t.select(); toast("Záloha je v políčku – zkopíruj ji."); };
    try { navigator.clipboard.writeText(data).then(() => toast("Záloha zkopírovaná."), fallback); } catch (e) { fallback(); }
  },
  restore() {
    const v = $("#bk").value.trim(); if (!v) { toast("Nejdřív vlož zálohu do políčka."); return; }
    try { const d = JSON.parse(v); if (typeof d !== "object" || !d) throw 0; S = Object.assign(defState(), d); save(); toast("Záloha obnovena."); go("domu"); }
    catch (e) { toast("Tohle nevypadá jako záloha. Zkopíruj ji celou."); }
  },
  reset(b) {
    if (!RESET_ARM) { RESET_ARM = true; b.textContent = "Opravdu smazat? Klikni znovu"; b.style.borderColor = "var(--bad)"; b.style.color = "var(--bad)"; return; }
    const keep = { notes: S.notes, general: S.general, enText: S.enText, exam: S.exam };
    S = Object.assign(defState(), keep); save(); toast("Pokrok smazán."); go("domu");
  }
};
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b || b.disabled) return;
  const f = ACT[b.dataset.act]; if (!f) return;
  if (b.tagName === "A") e.preventDefault();
  f(b, e);
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.id === "tsel" && el.value) { PK.scope = el.value; route(); }
  if (el.id === "exsel" && el.value) { EX = { t: el.value, phase: "answer", sec: 0, checked: {} }; route(); }
  if (el.id === "exam" && el.value) { S.exam = el.value; save(); toast("Datum uloženo."); }
  if (el.id === "only") { CPK.only = el.checked; $("#onlyl").classList.toggle("on", el.checked); }
  if (el.dataset && el.dataset.ex != null) { EX.checked[el.dataset.ex] = el.checked; el.closest(".check").classList.toggle("on", el.checked); }
});
let saveT = null;
document.addEventListener("input", e => {
  const el = e.target;
  if (el.id === "search") return renderTopicList(el.value);
  if (el.id === "ensearch") return renderVocab(el.value);
  if (el.id === "note-t") S.notes[el.dataset.t] = el.value;
  else if (el.id === "note-g") S.general = el.value;
  else if (el.id === "entext") S.enText = el.value;
  else return;
  clearTimeout(saveT); saveT = setTimeout(save, 400);
});
document.addEventListener("keydown", e => {
  if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  const h = location.hash.slice(1);
  if (h === "karticky-hra" && CS && CS.i < CS.list.length) {
    if (e.key === " " || e.key === "Enter") { e.preventDefault(); ACT.flip(); }
    else if (CS.flip && ["1", "2", "3"].includes(e.key)) { const b = $(`[data-act=rate][data-v="${e.key}"]`); if (b) ACT.rate(b); }
  }
  if (h === "kviz-hra" && QZ && QZ.i < QZ.list.length) {
    const q = QZ.list[QZ.i];
    if (!QZ.done && (q.type === "mc" || q.type === "tf")) { const i = { "1": 0, "2": 1, "3": 2, "4": 3, a: 0, b: 1, c: 2, d: 3 }[e.key.toLowerCase()]; const b = $$(".opt")[i]; if (b) ACT.ans(b); }
    else if (QZ.done && e.key === "Enter") { e.preventDefault(); ACT.next(); }
  }
});
window.addEventListener("hashchange", route);
route();
</script>
</body></html>
